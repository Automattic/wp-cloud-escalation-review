name: Plugin package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Build plugin
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python3 scripts/build_plugin.py --expect-version "${GITHUB_REF_NAME#v}"
          else
            python3 scripts/build_plugin.py
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wp-cloud-escalation-review-plugin
          path: dist/wp-cloud-escalation-review-plugin-*.zip

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download plugin package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wp-cloud-escalation-review-plugin
          path: dist

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/wp-cloud-escalation-review-plugin-*.zip
          --generate-notes
          --verify-tag
